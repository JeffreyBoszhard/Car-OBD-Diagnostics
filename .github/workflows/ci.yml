name: CI

# Lint and test on every push and pull request.
#
# The lint step exists because of a real bug: the MySQL backend shipped for
# two releases calling importlib.import_module() in a module that never
# imported importlib. Reaching that code needed a MySQL server, so no manual
# test ever hit it - but ruff's F821 sees an undefined name without one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6"

      - name: Check for undefined names, unused imports and likely bugs
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Import the app without an adapter attached
        # The dashboard has to start in demo mode on a machine with no OBD
        # hardware at all, which is exactly what a CI runner is.
        run: python -c "import app; print('imported', app.APP_VERSION, len(list(app.app.url_map.iter_rules())), 'routes')"
