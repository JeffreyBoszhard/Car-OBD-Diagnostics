<div id="changelog-overlay" class="confirm-overlay" hidden>
    <div class="confirm-dialog changelog-dialog" role="dialog" aria-modal="true" aria-labelledby="changelog-title">
        <p class="eyebrow">What's new</p>
        <h2 id="changelog-title">Updated to <span id="changelog-version">--</span></h2>
        <div id="changelog-entries" class="changelog-entries"></div>
        <div class="confirm-actions">
            <button id="changelog-close-button" class="primary-cta" type="button">Got it</button>
        </div>
    </div>
</div>
